<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#F5F5F7;--card:#fff;--text:#1C1C1E;--dim:#6E6E73;--line:rgba(0,0,0,.08);--btn:#1C1C1E;--btntext:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1F1F22;--text:#F5F5F7;--dim:#9A9AA0;--line:rgba(255,255,255,.09);--btn:#F2F2F4;--btntext:#141416}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 16px}
  main{width:100%;max-width:520px}
  .app{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 0 0 .5px var(--line),0 10px 30px rgba(0,0,0,.06);
    display:grid;grid-template-columns:72px 1fr;gap:4px 20px;align-items:center}
  .app img{width:72px;height:72px;grid-row:span 2}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:14px}
  p{grid-column:1 / -1;margin:16px 0 0;color:var(--dim);font-size:15px}
  .dl{grid-column:1 / -1;display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}
  .btn{display:inline-block;background:var(--btn);color:var(--btntext);text-decoration:none;font-weight:600;font-size:15px;
    padding:10px 20px;border-radius:999px}
  .btn:hover{opacity:.88}
  .small{color:var(--dim);font-size:13px}
  footer{color:var(--dim);font-size:12px}
  footer a{color:inherit}
</style>
</head>
<body>
<main>
  <section class="app">
    <img src="teleprompter/icon.png" alt="">
    <h1>Teleprompter</h1>
    <div class="meta" id="tp-meta">Für macOS</div>
    <p>Schwebender Teleprompter direkt unter der Kamera. Text folgt deiner Stimme oder scrollt in deinem Tempo – und bleibt in Bildschirmaufnahmen unsichtbar.</p>
    <div class="dl">
      <a class="btn" id="tp-dl" href="teleprompter/">Laden</a>
      <span class="small">macOS 12 oder neuer · Apple-Chip und Intel</span>
    </div>
  </section>
</main>
<footer><a href="https://desiree.at/impressum/">Impressum</a> · <a href="https://desiree.at/datenschutz/">Datenschutz</a></footer>
<script>
// Neueste Version aus der Update-Liste lesen, damit diese Seite nie veraltet
fetch("teleprompter/appcast.xml").then(r => r.text()).then(t => {
  const x = new DOMParser().parseFromString(t, "application/xml");
  const item = x.querySelector("item"); if (!item) return;
  const enc = item.querySelector("enclosure");
  const v = item.getElementsByTagName("sparkle:shortVersionString")[0] || item.querySelector("title");
  if (enc) document.getElementById("tp-dl").href = enc.getAttribute("url");
  if (v) { document.getElementById("tp-meta").textContent = "Version " + v.textContent + " · für macOS"; document.getElementById("tp-dl").dataset.version = v.textContent; }
}).catch(() => {});

// Downloads zählen (GoatCounter, ohne Cookies): jeder Klick auf „Laden“ als eigenes Ereignis mit Version
document.getElementById("tp-dl").addEventListener("click", e => {
  const v = e.currentTarget.dataset.version || "";
  if (window.goatcounter && window.goatcounter.count)
    window.goatcounter.count({path: "download-teleprompter-" + (v || "unbekannt"), title: "Download Teleprompter " + v, event: true});
});
</script>
<script data-goatcounter="https://desireedaydreams.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
